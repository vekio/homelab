services:
  nocodb:
    image: nocodb/nocodb:${NOCODB_VERSION:-latest}
    container_name: nocodb
    # ports:
    #   - 8080:8080
    networks:
      - proxy
      - productivity
    depends_on:
      productivity-db:
        condition: service_healthy
    environment:
      - NC_DB=pg://productivity-db:5432?u=nocodb&p=${NC_DB_PASS}&d=nocodb
      - NC_PUBLIC_URL=https://nocodb.${DOMAIN}
      - NC_DISABLE_TELE=true
      - NC_AUTH_JWT_SECRET=${NC_AUTH_JWT_SECRET}
    volumes:
      - ${VOLUMES_PATH}/productivity/nocodb:/usr/app/data:rw
    labels:
      - traefik.enable=true
      - traefik.http.routers.nocodb-rtr.entrypoints=websecure
      - traefik.http.routers.nocodb-rtr.rule=Host(`nocodb.${DOMAIN}`)
      - traefik.http.routers.nocodb-rtr.service=nocodb-svc
      - traefik.http.services.nocodb-svc.loadbalancer.server.port=8080
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    container_name: n8n
    networks:
      - proxy
      - productivity
    depends_on:
      productivity-db:
        condition: service_healthy
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=productivity-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASS}
      - N8N_HOST=flow.${DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://flow.${DOMAIN}
      - GENERIC_TIMEZONE=${TZ}
    volumes:
      - ${VOLUMES_PATH}/productivity/n8n:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n-rtr.entrypoints=websecure
      - traefik.http.routers.n8n-rtr.rule=Host(`flow.${DOMAIN}`)
      - traefik.http.routers.n8n-rtr.service=n8n-svc
      - traefik.http.services.n8n-svc.loadbalancer.server.port=5678
    restart: unless-stopped

  productivity-db:
    image: postgres:15
    container_name: productivity-db
    networks:
      - productivity
    volumes:
      - ${VOLUMES_PATH}/productivity/postgres:/var/lib/postgresql/data:rw
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASS}
    healthcheck:
      test: pg_isready -U postgres -d ${POSTGRES_DB_PASS}
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

networks:
  productivity:
    name: productivity
  proxy:
    external: true
