services:
  qbittorrent:
      image: linuxserver/qbittorrent:${QBITTORRENT_VERSION:-latest}
      container_name: qbittorrent
      ports:
        - 6881:6881
        - 6881:6881/udp
      environment:
        - PUID=${HOMELABUID}
        - PGID=${USERSGID}
        - TZ=${TZ}
        - WEBUI_PORT=8080
        - TORRENTING_PORT=6881
      volumes:
        - ${VOLUMES_PATH}/qbittorrent/config:/config:rw
        - ${DOWNLOAD_SHARE}/qbittorrent:/downloads:rw
        - ${DOWNLOAD_SHARE}/qbittorrent/watch:/watch:rw
      networks:
        - proxy
      labels:
        - traefik.enable=true
        - traefik.http.routers.qbittorrent-rtr.entrypoints=websecure
        - traefik.http.routers.qbittorrent-rtr.rule=Host(`torrent.${DOMAIN}`)
        - traefik.http.routers.qbittorrent-rtr.service=qbittorrent-svc
        - traefik.http.services.qbittorrent-svc.loadbalancer.server.port=8080
      restart: unless-stopped

networks:
  proxy:
    external: true
